<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lovem</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #login-screen { width: 100%; }
        #secret-content { display: none; background-color: #FFC0CB; height: 100vh; width: 100%; color: #D81B60; padding-top: 50px; }
        input { padding: 15px; border-radius: 10px; border: 1px solid #FF69B4; margin-bottom: 20px; text-align: center; width: 60%; background: #222; color: white; }
        button { padding: 15px 30px; background-color: #FF69B4; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
        .heart { font-size: 60px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="heart">❤️</div>
        <h2>Bizim Odamız</h2>
        <input type="password" id="sifre" placeholder="Özel Şifremiz..."><br>
        <button onclick="kontrolEt()">Giriş Yap</button>
    </div>
    <div id="secret-content">
        <h1>🌹 Seni Seviyorum 🌹</h1>
        <p>Burası sadece bize özel...</p>
        <div style="font-size: 80px;">💑</div>
    </div>
    <script>
        function kontrolEt() {
            var sifre = document.getElementById('sifre').value;
            if (sifre === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('secret-content').style.display = 'block';
                document.body.style.backgroundColor = "#FFC0CB";
            } else {
                alert("Yanlış şifre sevgilim! ❤️");
            }
        </script>
</body>
</html>
