<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lovem - Bizim Dünyamız</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
        .container { width: 90%; max-width: 400px; padding: 25px; border-radius: 25px; background: #1e1e1e; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h1 { color: #FF69B4; font-size: 28px; margin-bottom: 5px; }
        input { width: 90%; padding: 14px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; background: #2a2a2a; color: white; text-align: center; font-size: 16px; outline: none; }
        button { width: 95%; padding: 15px; margin: 10px 0; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-create { background: transparent; color: #FF69B4; border: 2px solid #FF69B4; }
        .btn-login { background: #FF69B4; color: white; }
        
        /* ÖZEL TATLI MESAJ PANELİ */
        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .alert-box { width: 85%; max-width: 320px; background: #252525; padding: 30px; border-radius: 30px; border-bottom: 5px solid #FF69B4; text-align: center; animation: waveIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes waveIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .alert-icon { font-size: 60px; margin-bottom: 15px; display: block; }
        .alert-text { font-size: 18px; margin-bottom: 25px; color: #fff; }
        .alert-btn { background: #FF69B4; color: white; padding: 12px; border-radius: 12px; width: 100%; }

        /* GİZLİ ODA VE MENÜ */
        #secret-page { display: none; width: 100%; min-height: 100vh; background: #D81B60; position: fixed; top: 0; left: 0; padding: 20px; box-sizing: border-box; z-index: 100; overflow-y: auto; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-item { background: rgba(255, 255, 255, 0.2); color: white; padding: 20px; border-radius: 20px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); }
        
        .sub-page { display: none; margin-top: 20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 25px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        textarea { width: 100%; height: 200px; border-radius: 15px; border: none; padding: 10px; box-sizing: border-box; }
        
        #counter-display { font-size: 22px; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container" id="login-screen">
        <div style="font-size: 60px; margin-bottom: 10px;">🔐</div>
        <h1>Lovem</h1>
        <p style="color: #aaa;">Sadece bize özel bir dünya...</p>
        <input type="text" id="new-lock" placeholder="Yeni Kilit İsmi...">
        <button class="btn-create" onclick="odaOlustur()">Kilidi Oluştur</button>
        <div style="height: 1px; background: #333; margin: 20px 0;"></div>
        <input type="password" id="entry-lock" placeholder="Kilidini Yaz sevgilim...">
        <button class="btn-login" onclick="odayaGir()">Odaya Gir</button>
    </div>

    <div id="custom-alert">
        <div class="alert-box">
            <span id="alert-icon" class="alert-icon"></span>
            <div id="alert-message" class="alert-text"></div>
            <button class="alert-btn" onclick="alertKapat()">Tamam sevgilim ❤️</button>
        </div>
    </div>

    <div id="secret-page">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button onclick="anaMenuyeDon()" id="back-btn" style="display:none; width:auto; background:rgba(0,0,0,0.3); padding:5px 15px;">⬅ Geri</button>
            <span id="room-badge" style="font-size: 12px; opacity: 0.8;"></span>
            <button onclick="location.reload()" style="width: auto; background: white; color: #D81B60; padding: 5px 15px;">Çıkış</button>
        </div>

        <h2 id="room-title" style="margin-top: 20px;"></h2>

        <div id="main-menu" class="menu-grid">
            <button class="menu-item" onclick="sayfaAc('anilar')">📖<br>Anılarımız</button>
            <button class="menu-item" onclick="sayfaAc('sayac')">⏱️<br>Aşk Sayacı</button>
            <button class="menu-item" onclick="sayfaAc('boyama')">🎨<br>Sürpriz Boyama</button>
            <button class="menu-item" onclick="sayfaAc('neden')">❓<br>Neden Sen?</button>
        </div>

        <div id="page-anilar" class="sub-page">
            <textarea id="room-data" placeholder="Bugün neler hissettin?"></textarea>
            <button style="background: white; color:#D81B60;" onclick="kaydet()">Anıyı Kaydet 🌹</button>
        </div>

        <div id="page-sayac" class="sub-page">
            <p>Beraberliğiniz ne zaman başladı?</p>
            <input type="date" id="start-date" style="background: white; color: black;">
            <button style="background: white; color:#D81B60;" onclick="tarihKaydet()">Tarihi Sabitle ❤️</button>
            <div id="counter-display" style="margin-top: 20px;"></div>
        </div>

        <div id="page-boyama" class="sub-page">
            <h3>🎨 Sürpriz Yakında!</h3>
            <p>Bu bölüm geliştirme aşamasında sevgilim.</p>
        </div>

        <div id="page-neden" class="sub-page">
            <h3 id="neden-text">Butona bas sevgilim...</h3>
            <button style="background: white; color:#D81B60;" onclick="nedenUret()">Bir Neden Söyle ✨</button>
        </div>
    </div>

    <script>
        let aktifOda = "";
        let sayacInterval;

        function uyar(m, i) {
            document.getElementById('alert-message').innerText = m;
            document.getElementById('alert-icon').innerText = i;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function alertKapat() { document.getElementById('custom-alert').style.display = 'none'; }

        function odaOlustur() {
            let k = document.getElementById('new-lock').value.trim();
            let odalar = JSON.parse(localStorage.getItem('oda_listesi') || "[]");
            if (k.length < 3) { uyar("Kilit çok kısa! ❤️", "📏"); return; }
            if (odalar.includes(k)) { uyar("Bu kilit daha önce alınmış sevgilim!", "🔐"); return; }
            odalar.push(k);
            localStorage.setItem('oda_listesi', JSON.stringify(odalar));
            uyar("Odan başarıyla mühürlendi! ✅", "💖");
            document.getElementById('new-lock').value = "";
        }

        function odayaGir() {
            let g = document.getElementById('entry-lock').value.trim();
            let odalar = JSON.parse(localStorage.getItem('oda_listesi') || "[]");
            if (odalar.includes(g)) {
                aktifOda = g;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('secret-page').style.display = 'block';
                document.getElementById('room-title').innerText = aktifOda + " Odası";
                document.getElementById('room-badge').innerText = "Kilit: " + aktifOda;
                document.getElementById('room-data').value = localStorage.getItem('data_' + aktifOda) || "";
                sayacBaslat();
            } else { uyar("Bu anahtar yanlış sevgilim... 💔", "🗝️"); }
        }

        function sayfaAc(p) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.sub-page').forEach(s => s.style.display = 'none');
            document.getElementById('page-' + p).style.display = 'block';
            document.getElementById('back-btn').style.display = 'block';
        }

        function anaMenuyeDon() {
            document.getElementById('main-menu').style.display = 'grid';
            document.querySelectorAll('.sub-page').forEach(s => s.style.display = 'none');
            document.getElementById('back-btn').style.display = 'none';
        }

        function kaydet() {
            localStorage.setItem('data_' + aktifOda, document.getElementById('room-data').value);
            uyar("Anımız kaydedildi! ✨", "🌹");
        }

        function tarihKaydet() {
            let t = document.getElementById('start-date').value;
            if(!t) return;
            localStorage.setItem('tarih_' + aktifOda, t);
            uyar("Tarihimiz mühürlendi! ❤️", "⏱️");
            sayacBaslat();
        }

        function sayacBaslat() {
            if(sayacInterval) clearInterval(sayacInterval);
            let t = localStorage.getItem('tarih_' + aktifOda);
            if(!t) { document.getElementById('counter-display').innerHTML = "Henüz tarih seçilmedi."; return; }
            
            sayacInterval = setInterval(() => {
                let fark = new Date() - new Date(t);
                let gun = Math.floor(fark / (1000 * 60 * 60 * 24));
                let saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
                let dak = Math.floor((fark / 1000 / 60) % 60);
                let san = Math.floor((fark / 1000) % 60);
                document.getElementById('counter-display').innerHTML = `${gun} Gün ${saat} Saat<br>${dak} Dakika ${san} Saniye`;
            }, 1000);
        }

        function nedenUret() {
            const nedenler = ["Gülüşün dünyayı aydınlatıyor.", "Seninle her an çok huzurlu.", "Kalbimi sadece sen anlıyorsun.", "Varlığın en büyük hediyem."];
            document.getElementById('neden-text').innerText = nedenler[Math.floor(Math.random() * nedenler.length)];
        }
    </script>
</body>
</html>
