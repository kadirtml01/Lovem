name: Build Lovem APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Build APK
        run: |
          cordova create build_folder com.kadir.lovem Lovem
          # Dosyaların varlığını kontrol ederek kopyalıyoruz
          [ -f index.html ] && cp index.html build_folder/www/index.html || echo "index.html bulunamadı"
          [ -f config.xml ] && cp config.xml build_folder/config.xml || echo "config.xml bulunamadı"
          cd build_folder
          cordova platform add android@10.1.1
          cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Lovem-Uygulamasi
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
