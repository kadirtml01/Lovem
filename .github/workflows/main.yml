name: Build Lovem APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Güncellendi: v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Güncellendi: v4
        with:
          node-version: '20' # Modern node versiyonu

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Build Project
        run: |
          cordova create tmp_proj com.kadir.lovem Lovem
          cp index.html tmp_proj/www/index.html
          cp config.xml tmp_proj/config.xml
          cd tmp_proj
          cordova platform add android@10.1.1
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # İşte hata veren yer burasıydı, v4 yaptık!
        with:
          name: Lovem-Uygulamasi
          path: tmp_proj/platforms/android/app/build/outputs/apk/debug/app-debug.apk
